[project]
name = "nightshift"
version = "0.1.0"
description = "Bounded autonomous maintainer that turns approved GitHub issues into tested draft pull requests."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
github-app = ["cryptography>=42"]
agent = ["google-adk[gcp]>=2.0.0,<3.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
